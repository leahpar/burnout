[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    h2zero/NimBLE-Arduino@^2.1.0

; Port série de l'ESP32 joint par le relais RFC 2217 (voir notes/journal.md)
upload_port = rfc2217://127.0.0.1:4000?ign_set_control
monitor_port = rfc2217://127.0.0.1:4000?ign_set_control
monitor_speed = 115200
; DTR/RTS actifs = ESP32 maintenu en reset, console muette
monitor_dtr = 0
monitor_rts = 0
